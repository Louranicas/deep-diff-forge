version: 2
# Each entry groups its updates into one pull request: every Cargo bump moves the committed
# SBOM (and a workspace bump also moves fuzz/Cargo.lock), so a reviewer regenerates both once
# per group instead of once per crate.
updates:
  # Keep Cargo dependencies patched (security updates land promptly).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      cargo:
        patterns: ["*"]

  # The fuzz harness has its own lockfile (fuzz/Cargo.lock), outside the workspace (anchor B-06).
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      fuzz:
        patterns: ["*"]

  # The Python client (sdk/python/pyproject.toml): no runtime dependencies, only the setuptools
  # build requirement, which Dependabot keeps current.
  - package-ecosystem: pip
    directory: "/sdk/python"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5

  # Keep third-party GitHub Actions current. Workflows pin immutable commit SHAs;
  # Dependabot proposes reviewed SHA updates without introducing floating tags.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
