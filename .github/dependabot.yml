version: 2
updates:
  # Keep Cargo dependencies patched (security updates land promptly).
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10

  # Keep third-party GitHub Actions current. Workflows pin immutable commit SHAs;
  # Dependabot proposes reviewed SHA updates without introducing floating tags.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
