# Weekly long-running evidence that does not fit a pull request: a 10-minute hostile daemon soak
# with real review work and leak checks, an hour of fuzzing for every fuzz target, and a full
# benchmark run whose receipt is kept (deep-diff-forge.bench.v0). CI runs
# the same two things for 10 s each (ci.yml), which is a smoke test, not a campaign
# (docs/PRODUCTION_READINESS.md, 2026-10-30). Each run keeps its receipts as artifacts; a fuzz
# crash keeps its input under fuzz/artifacts/<target>/.
name: campaign

on:
  # Monday 05:41 UTC: after ci.yml's weekly run (04:23), off the hour.
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch:
    inputs:
      soak_seconds:
        description: Seconds the daemon soak runs (at least 600 for the growth checks to bind)
        default: "600"
      fuzz_seconds:
        description: Seconds each fuzz target runs
        default: "3600"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: campaign-${{ github.ref }}
  cancel-in-progress: false

jobs:
  soak:
    name: daemon soak (long)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: hostile daemon soak with real review work
        env:
          DDF_SOAK_SECONDS: ${{ inputs.soak_seconds || '600' }}
        # --require-growth-check: a run too short to compare early and late samples fails
        # rather than passing with the leak checks unmeasured.
        run: python3 scripts/security/daemon_soak.py --require-growth-check
      - name: keep the soak receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: daemon-soak-receipt
          path: reports/security/daemon-soak-*.json
          if-no-files-found: error

  bench:
    name: bench (full)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: every workload, 15 repetitions, release build
        run: |
          cargo build --release --locked -p deep-diff-forge-cli
          target/release/deep-diff-forge bench --json > bench-receipt.json
          target/release/deep-diff-forge bench < /dev/null
      - name: keep the bench receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: bench-receipt
          path: bench-receipt.json
          if-no-files-found: error

  fuzz-targets:
    name: fuzz targets
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - name: list every target in fuzz/Cargo.toml
        id: list
        # The matrix comes from the manifest, so no target can be left out of the campaign.
        run: |
          targets=$(scripts/fuzz_target.sh --list | python3 -c 'import json, sys; t = sys.stdin.read().split(); assert t, "no fuzz targets"; print(json.dumps(t))')
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  fuzz:
    name: fuzz campaign (${{ matrix.target }})
    needs: fuzz-targets
    runs-on: ubuntu-26.04
    # An hour of fuzzing plus about 10 minutes of tool installs and the instrumented build.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.fuzz-targets.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: install pinned fuzz tools
        run: |
          cargo install cargo-fuzz --version 0.13.2 --locked
          rustup toolchain install nightly-2026-10-25 --profile minimal
      - name: fuzz ${{ matrix.target }}
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ inputs.fuzz_seconds || '3600' }}
        run: scripts/fuzz_target.sh "$TARGET" "$FUZZ_SECONDS"
      - name: keep the crashing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2 (node24)
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: warn
