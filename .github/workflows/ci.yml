# DDF integration: R39, R40, R41, R42, R43, R44, R45, R46, R57, R58, R59. Make checks fail closed, preserve fuzz crash evidence, use the actual build output path and gate tag publication on the quality workflow.
# Design/status: docs/RECOMMENDATION_INTEGRATION.md#quality-gates
# Module vault note (bidirectional): obsidian://open?vault=deep-diff-forge.vault&file=Implementation%2FModules%2F.github--workflows--ci
name: ci

on:
  # release.yml calls this workflow as its `quality` gate and passes `release: true`.
  workflow_call:
    inputs:
      release:
        description: "true when release.yml calls this as its quality gate"
        type: boolean
        default: false
  pull_request:
  push:
    branches: [main]
  # Weekly (anchor B-11): a new RustSec advisory or a yanked dependency fails here even when
  # nothing is merged that week. Monday 04:23 UTC, off the hour to avoid the scheduler's peak.
  schedule:
    - cron: "23 4 * * 1"
  # A manual run, which also runs the macOS job.
  workflow_dispatch:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

env:
  CARGO_TARGET_DIR: target
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: secret scan (gitleaks)
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: gitleaks (pinned release, checksum-verified)
        # Same version as the local pre-push hook. No GitHub attestation is published for it,
        # so the release tarball is pinned by its SHA-256.
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -fsSLo gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks git --no-banner --redact --exit-code 1 .

  msrv:
    name: declared Rust 1.88 compatibility
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.88.0
      - name: check on Rust 1.88
        run: cargo check --workspace --all-targets --locked

  # macOS binaries ship from release.yml, so their tests run on every event: each pull request,
  # each push to main, the weekly run, a manual run and a release (release.yml calls this
  # workflow). Before 2026-10-30 they ran only weekly, manually and on release, and two macOS
  # breaks in PR #44 were caught only by a manual run. The job takes about 4 minutes, so it runs
  # on every pull request rather than behind a path filter, which would miss a break that reaches
  # the daemon or the socket code through another crate.
  macos:
    name: macOS tests
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      # --no-fail-fast: one run reports every failing test binary, not just the first.
      - name: test on macOS
        run: cargo test --workspace --locked --no-fail-fast

  # Linux arm64 binaries ship from release.yml (since 2026-10-31, built and run on
  # ubuntu-22.04-arm, the image the release builds on: on ubuntu-24.04-arm the binary needed
  # GLIBC_2.39, over the declared 2.34 floor, measured in PR #79), so the suite runs there on every event
  # too. Not a required check on pull requests (the required set lives in a GitHub ruleset), but
  # it gates every release build through release.yml's `quality`.
  linux-arm64:
    name: Linux arm64 tests
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      # 22.04's python3 is 3.10, without the tomllib that scripts/fuzz_target.sh parses
      # fuzz/Cargo.toml with (measured in PR #82).
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: test on Linux arm64
        run: cargo test --workspace --locked --no-fail-fast
      # The release smoke checks the shipped (release) binary; this is the early warning on the
      # debug binary the tests built.
      - name: glibc floor of the arm64 binary
        run: scripts/check_glibc_floor.sh target/debug/deep-diff-forge

  # The launchd agent in contrib/ loaded by a real launchd: bootstrap, `daemon health`, restart
  # after a crash, no restart after `daemon stop`, bootout (scripts/launchd_smoke.sh). Its own
  # job, so the required `macOS tests` check does not depend on it. Not a required check, and
  # skipped in release runs: until the smoke has a record on hosted runners, its timed waits
  # must not block a release build (release.yml passes `release: true`). `linux-arm64` is not
  # skipped there: it tests a target that ships, as `macos` does.
  launchd:
    name: macOS launchd agent
    if: ${{ !inputs.release }}
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: build the CLI
        run: cargo build --locked -p deep-diff-forge-cli
      - name: load the launchd agent and check its lifecycle
        timeout-minutes: 5
        run: scripts/launchd_smoke.sh target/debug/deep-diff-forge

  gate:
    name: deploy gate-feature
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      # Pinned to the gate image's toolchain: a floating `stable` broke main when a new release
      # deprecated `fetch_update` under `-D warnings`.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - name: parsed antipattern policy and planted refusal controls
        run: |
          python3 scripts/security/review_policy_check.py --selftest
          python3 scripts/security/review_policy_check.py
      - name: exemption oracle unit tests
        run: python3 -I crates/deep-diff-forge-review/policy/test_exemption_oracle.py
      - name: format
        run: cargo fmt --all --check
      - name: compile
        run: cargo check --workspace --locked
      - name: lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: pedantic
        run: cargo clippy --workspace --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: pedantic (feature and fuzz coverage)
        # The workspace pass builds default features only, and the fuzz crate is outside the workspace.
        run: |
          cargo clippy -p deep-diff-forge-patch --no-default-features --all-targets --locked -- -D warnings -W clippy::pedantic
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings -W clippy::pedantic
      - name: test
        run: cargo test --workspace --locked
      - name: docs
        # Mirror the docs.rs build so a broken intra-doc link fails CI, not the
        # public docs page after publish.
        env:
          RUSTDOCFLAGS: -D warnings -D rustdoc::broken_intra_doc_links
        run: cargo doc --workspace --no-deps --locked
      - name: contracts
        run: |
          cargo run --locked -p deep-diff-forge-cli -- --self-test
          cargo run --locked -p deep-diff-forge-cli -- doctor
          cargo run --locked -p deep-diff-forge-cli -- claude-code-contract
          cargo run --locked -p deep-diff-forge-cli -- chain-contract
          cargo run --locked -p deep-diff-forge-cli -- cluster-contract
          cargo run --locked -p deep-diff-forge-cli -- loom-contract
      - name: deploy status
        run: cargo run --locked -p deep-diff-forge-cli -- deploy status --json
      - name: fuzz harness compile gate
        run: cargo check --locked --manifest-path fuzz/Cargo.toml --bins
      - name: daemon soak leak-check regressions
        run: python3 -I scripts/security/test_daemon_soak.py
      - name: bench comparison regressions
        run: python3 -I scripts/test_bench_compare.py
      - name: hostile daemon soak smoke
        env:
          DDF_SOAK_SECONDS: 10
        run: python3 scripts/security/daemon_soak.py
      - name: privacy probe failure regressions
        run: python3 scripts/security/test_privacy_probe.py
      - name: learning privacy probe
        run: python3 scripts/security/privacy_probe.py
      - name: python SDK against the built binary
        run: |
          cargo build --locked -p deep-diff-forge-cli
          python3 -I sdk/python/test_deep_diff_forge.py

  review-controller-evidence:
    name: review controller mutation and fuzz evidence
    runs-on: ubuntu-26.04
    # Raised from 30: the gate image build installs two Rust toolchains and compiles
    # cargo-mutants and cargo-fuzz inside the image.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: install pinned evidence tools
        run: |
          cargo install cargo-mutants --version 27.1.0 --locked
          cargo install cargo-fuzz --version 0.13.2 --locked
          rustup toolchain install nightly-2026-10-25 --profile minimal
      - name: scoped mutation of admission and receipt qualification
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/ddf-review-mutation-target
        run: cargo mutants --package deep-diff-forge-review --re 'identifier|check_execution' --test-workspace true --timeout 300
      - name: instrumented fuzz smoke for every target
        # Every target in fuzz/Cargo.toml runs here for 10 s (anchor B-06); before, four only ever
        # compiled. The list comes from the manifest (scripts/fuzz_target.sh --list), so a new
        # target cannot be added without running, and a target with no seeds fails. The weekly
        # campaign (campaign.yml) runs the same script for an hour per target.
        run: |
          targets=$(scripts/fuzz_target.sh --list)
          test -n "$targets"
          for target in $targets; do
            scripts/fuzz_target.sh "$target" 10
          done
      # Council quality gates only run inside the rootless Podman gate sandbox
      # (docs/REVIEW_COUNCIL.md#gate-sandbox). The ubuntu runner images ship podman.
      #
      # Every job is pinned to ubuntu-26.04, the image this step was last measured on: on
      # 2026-10-27 (PR #19, run 40475668326) Ubuntu 26.04.1 LTS, kernel 7.0.0-1017-azure and
      # podman 5.7.0 started with kernel.apparmor_restrict_unprivileged_userns=1, as 24.04 did;
      # the step below lifted it and all 12 planted-breach probes were refused. The pin is
      # explicit (not ubuntu-latest), so the next image move is again its own measured change.
      # Originally UNVERIFIED on GitHub-hosted runners: Ubuntu 23.10+ (so ubuntu-24.04)
      # restricts unprivileged user namespaces through AppArmor, which can make rootless
      # podman fail with "unshare(...): Operation not permitted". Ubuntu documents the switch
      # kernel.apparmor_restrict_unprivileged_userns (set it to 0 to lift the restriction):
      #   https://ubuntu.com/blog/ubuntu-23-10-restricted-unprivileged-user-namespaces
      # The runner-images tracker records the 22.04 -> 24.04 breakage but no official fix:
      #   https://github.com/actions/runner-images/issues/10443
      # No GitHub-maintained recommendation for rootless podman on ubuntu-24.04 was found, so
      # this relaxes the sysctl on the ephemeral runner VM only when it is present and set.
      # The alternative is a per-binary AppArmor profile granting `userns,` (same Ubuntu post).
      - name: allow rootless podman user namespaces (measured on ubuntu-24.04 2026-10-26, ubuntu-26.04 2026-10-27)
        run: |
          podman --version
          # Ubuntu 26 trial: record the image, kernel and the restriction's starting value.
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          uname -r
          echo "apparmor_restrict_unprivileged_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)"
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: build council gate image
        run: |
          # The Containerfile builds with --pull=never, so pull its digest-pinned base first.
          base="$(sed -n 's/^FROM \([^ ]*@sha256:[0-9a-f]*\).*/\1/p' review-policy/sandbox/Containerfile | sort -u)"
          test "$(printf '%s\n' "$base" | wc -l)" -eq 1
          podman pull "$base"
          podman build --pull=never -t localhost/ddf-council-gate:ci -f review-policy/sandbox/Containerfile review-policy/sandbox
          podman image inspect --format '{{.Id}}' localhost/ddf-council-gate:ci
      # The credential probes must have something to fail to read, or their refusal is vacuous
      # (council_sandbox.rs asserts the files exist). A runner has no agent credentials, so plant
      # canaries with no secret in them at the paths the probes target.
      - name: plant canary credentials for the sandbox probes
        run: |
          mkdir -p "$HOME/.codex" "$HOME/.claude"
          printf 'ddf-ci-canary\n' > "$HOME/.codex/auth.json"
          printf 'ddf-ci-canary\n' > "$HOME/.claude/.credentials.json"
          chmod 600 "$HOME/.codex/auth.json" "$HOME/.claude/.credentials.json"
      - name: council gate sandbox integration
        env:
          DDF_COUNCIL_SANDBOX_IT: "1"
          DDF_COUNCIL_PODMAN: podman
          DDF_COUNCIL_GATE_IMAGE: localhost/ddf-council-gate:ci
        run: cargo test --locked -p deep-diff-forge-cli --test council_sandbox -- --ignored --nocapture
      # A failed probe run leaves its run directory behind; show why each job failed.
      - name: sandbox diagnostics on failure
        if: failure()
        run: |
          podman info --format 'network={{.Host.NetworkBackend}} pasta={{.Host.Pasta.Executable}} slirp={{.Host.Slirp4NetNS.Executable}}' || true
          podman --version
          for f in /tmp/ddf-council-sandbox-*/run/jobs/*/stderr.log /tmp/ddf-council-sandbox-*/run/jobs/*/protocol-error.txt /tmp/ddf-council-sandbox-*/run/jobs/*/qualification-error.txt; do
            [ -f "$f" ] && { echo "== $f"; tail -n 40 "$f"; }
          done
          true

  diff-mutation:
    # Anchor B-01: every pull request's changed Rust lines are mutated against its merge base, and
    # one missed mutant or timeout fails. Sharded four ways so a large change still fits.
    name: diff mutation (shard ${{ matrix.shard }}/4)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: install cargo-mutants
        run: cargo install cargo-mutants --version 27.1.0 --locked
      - name: mutate the pull request's changed lines
        env:
          BASE_REF: ${{ github.base_ref }}
          SHARD: ${{ matrix.shard }}
          DDF_MUTATION_OUT: ${{ runner.temp }}/ddf-diff-mutation
          CARGO_TARGET_DIR: ${{ runner.temp }}/ddf-diff-mutation-target
        run: scripts/diff_mutation.sh "origin/$BASE_REF" "$SHARD/4"

  # Plan 2026-10-30 (M2): the pull request's head against its merge base, built and run on one
  # runner, alternating three times; each workload's best median per side is compared
  # (scripts/bench_compare.py: over 25% and over 0.2 ms slower fails). Required since 2026-10-31
  # (owner decision; until then informational, with 0 false failures in its real comparisons).
  bench:
    name: bench (base vs head)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: build the head and the merge base
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          cargo build --release --locked -p deep-diff-forge-cli
          cp target/release/deep-diff-forge "$RUNNER_TEMP/head"
          git worktree add "$RUNNER_TEMP/base-src" "$(git merge-base "origin/$BASE_REF" HEAD)"
          (cd "$RUNNER_TEMP/base-src" && cargo build --release --locked -p deep-diff-forge-cli)
          cp "$RUNNER_TEMP/base-src/target/release/deep-diff-forge" "$RUNNER_TEMP/base"
      - name: base and head, alternating
        run: |
          if ! "$RUNNER_TEMP/base" bench --help > /dev/null 2>&1; then
            echo "the merge base has no bench command: nothing to compare"
            exit 0
          fi
          for round in 1 2 3; do
            "$RUNNER_TEMP/base" bench --quick --json > "$RUNNER_TEMP/base-$round.json"
            "$RUNNER_TEMP/head" bench --quick --json > "$RUNNER_TEMP/head-$round.json"
          done
          python3 scripts/bench_compare.py --base "$RUNNER_TEMP"/base-*.json --head "$RUNNER_TEMP"/head-*.json

  supply-chain:
    name: supply chain audit
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: cargo-deny (bans, licenses, sources, advisories)
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check
      - name: install host cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo-deny fuzz harness
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check
      # cargo-deny does not fail on every informational unsoundness advisory, so
      # cargo-audit is the strict, no-waiver advisory gate.
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit (strict advisory gate)
        run: cargo audit --deny warnings
      - name: cargo audit fuzz lockfile
        run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: SPDX SBOM gate (regenerate + verify against committed baseline)
        run: |
          python3 scripts/security/generate_spdx_sbom.py
          # Strip the timestamp-only field before comparing so a content-identical
          # SBOM that differs only in creation time still passes the gate.
          python3 - <<'EOF'
          import re, sys
          def strip_ts(text):
              # sbom.spdx.json is SPDX-JSON, not tag-value; "created" is a JSON string field.
              return re.sub(r'"created":\s*"[^"]*"', '"created": "<stripped>"', text)
          with open('sbom.spdx.json') as f:
              regen = f.read()
          import subprocess, os
          committed = subprocess.check_output(['git', 'show', 'HEAD:sbom.spdx.json'], text=True)
          if strip_ts(regen) != strip_ts(committed):
              print('SBOM DRIFT: regenerated SBOM differs from committed baseline.')
              print('Run: python3 scripts/security/generate_spdx_sbom.py && git add sbom.spdx.json')
              sys.exit(1)
          print('SBOM OK: content matches committed baseline (timestamp ignored).')
          EOF
