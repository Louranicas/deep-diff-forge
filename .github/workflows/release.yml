# DDF integration: R39, R40, R41, R42, R43, R44, R45, R46, R57, R58, R59. Make checks fail closed, preserve fuzz crash evidence, use the actual build output path and gate tag publication on the quality workflow.
# Design/status: docs/RECOMMENDATION_INTEGRATION.md#quality-gates
# Module vault note (bidirectional): obsidian://open?vault=deep-diff-forge.vault&file=Implementation%2FModules%2F.github--workflows--release
name: release

on:
  push:
    tags: ['v*']
  # Dry run: the same quality gate, supply-chain gate, builds, binary smoke and checksum checks
  # on any ref, with nothing published, released or attested. Only a pushed `v*` tag does those,
  # so a dispatch from a tag (even a `v` one) is still a dry run.
  workflow_dispatch:

# Least privilege by default; the job that creates the GitHub Release elevates.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Never let two tag workflows publish the same dependency chain concurrently.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Every ci.yml job runs here and must pass before `build`, except those ci.yml skips on
  # `release: true` (only `launchd`, until its smoke has a record on hosted runners).
  quality:
    uses: ./.github/workflows/ci.yml
    with:
      release: true

  # Supply-chain gate: a tag must not publish past a known advisory, a denied
  # license, or a yanked dependency. crates.io publication is irreversible, so
  # this is a hard prerequisite of every downstream job.
  supply-chain:
    name: supply chain gate
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: cargo-deny
        uses: EmbarkStudios/cargo-deny-action@8f84122a46a358a27cb0625d85ad60ab436a1b87 # v2
        with:
          command: check
      - name: install host cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked
      - name: cargo-deny fuzz harness
        run: cargo deny --manifest-path fuzz/Cargo.toml --locked check
      - name: install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit (strict advisory gate)
        run: cargo audit --deny warnings
      - name: cargo audit fuzz lockfile
        run: cargo audit --deny warnings --file fuzz/Cargo.lock
      - name: verify release tag matches workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "${RELEASE_TAG}" = "v${version}" || {
            echo "::error::release tag ${RELEASE_TAG} does not match workspace version v${version}"
            exit 1
          }

  build:
    name: build ${{ matrix.target }}
    needs: [quality, supply-chain]
    permissions:
      contents: write # create the GitHub Release + upload assets
      attestations: write # GitHub Artifact Attestations / SLSA provenance
      id-token: write # OIDC token required by attest-build-provenance
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Unix-only: the daemon is built on Unix domain sockets, so the CLI does
        # not compile on Windows (the crate emits a clear compile_error there).
        # The exact supported targets are these four (README.md#supported-platforms); musl is
        # not built.
        include:
          # The Linux binaries stay on the older LTS on purpose: a binary links against the
          # glibc of the image that built it, so building on 26.04 would stop it running on
          # 24.04-era distributions (decision of the Ubuntu 26 move, 2026-10-27). The smoke
          # holds them to the declared glibc floor (scripts/check_glibc_floor.sh).
          # Every binary is run before it ships: the arm64 Linux one natively on GitHub's arm64
          # runner (free for public repositories); macos-latest is arm64, so the x86_64 macOS
          # binary is cross-built and run under Rosetta 2 (`run_under`).
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu, run_under: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, run_under: "" }
          - { os: macos-latest, target: x86_64-apple-darwin, run_under: "arch -x86_64" }
          - { os: macos-latest, target: aarch64-apple-darwin, run_under: "" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
      - name: build release binary
        env:
          TARGET: ${{ matrix.target }}
        run: cargo build --release --locked -p deep-diff-forge-cli --target "${TARGET}"
      # The shipped binary must run and review a patch before anything is published from it.
      - name: smoke the release binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUN_UNDER: ${{ matrix.run_under }}
        run: |
          set -euo pipefail
          bin="target/${TARGET}/release/deep-diff-forge"
          # RUN_UNDER is empty or a command prefix; it is split into words on purpose (no array,
          # so the macOS system bash 3.2 runs this too).
          if [ -n "${RUN_UNDER}" ]; then
            # Rosetta 2 is not always installed on arm64 runners.
            ${RUN_UNDER} /usr/bin/true 2>/dev/null || sudo softwareupdate --install-rosetta --agree-to-license
            file "${bin}" | grep -q x86_64 || { echo "::error::${bin} is not an x86_64 binary"; exit 1; }
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          test "$(${RUN_UNDER} "${bin}" --version)" = "deep-diff-forge ${version}" || {
            echo "::error::${bin} --version does not report ${version}"; exit 1
          }
          ${RUN_UNDER} "${bin}" --stdin-patch --json --require-files < fixtures/patch/basic.patch > smoke.json
          grep -q '"schema": "deep-diff-forge.review.v0"' smoke.json || {
            echo "::error::${bin} did not produce a review document"; exit 1
          }
          case "${TARGET}" in
            *-linux-gnu) scripts/check_glibc_floor.sh "${bin}" ;;
          esac
      - name: generate SPDX SBOM (single canonical release artifact)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: python3 scripts/security/generate_spdx_sbom.py
      - name: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dist="deep-diff-forge-${TAG}-${TARGET}"
          mkdir -p "${dist}"
          cp "target/${TARGET}/release/deep-diff-forge" "${dist}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${dist}/"
          tar czf "${dist}.tar.gz" "${dist}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          else
            shasum -a 256 "${dist}.tar.gz" > "${dist}.tar.gz.sha256"
          fi
          # The checksum that ships must verify the archive that ships.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -c "${dist}.tar.gz.sha256"
          else
            shasum -a 256 -c "${dist}.tar.gz.sha256"
          fi
      # Attestations go to a public transparency log, so only a release tag makes them.
      - name: attest release provenance
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            deep-diff-forge-*.tar.gz
            deep-diff-forge-*.tar.gz.sha256
      - name: attest SBOM provenance
        if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: sbom.spdx.json
      - name: upload release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (node24)
        with:
          files: |
            deep-diff-forge-*.tar.gz
            deep-diff-forge-*.tar.gz.sha256
      - name: upload release SBOM
        if: matrix.target == 'x86_64-unknown-linux-gnu' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3 (node24)
        with:
          files: sbom.spdx.json

  # crates.io publication is irreversible and on hold by owner decision (2026-10-27) until the
  # codebase is production-hardened. The hold is this condition, not the absence of a token: the
  # job runs only after the owner sets the repository variable DDF_CRATES_IO to `open`.
  publish:
    name: crates.io publish (owner-gated)
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && vars.DDF_CRATES_IO == 'open'
    # The token lives in the `release` environment, which only `v*` tags can deploy to.
    environment: release
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.99.1
      - name: publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          # The owner opened the gate, so a missing token is a failed release, not a quiet skip.
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::DDF_CRATES_IO is open but CARGO_REGISTRY_TOKEN is not set in the release environment"
            exit 1
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match workspace version v${version}"
            exit 1
          fi
          # Idempotent + rate-limit-aware: skip crates already live at the workspace version, and
          # retry crates.io's new-crate 429 limit (burst 5, then ~1/10min) until
          # each remaining crate lands. Lets a re-run finish a partial publish
          # without re-failing on already-published crates.
          for crate in core patch projection syntax graph pipeline agent cluster learning daemon sdk tui review cli; do
            name="deep-diff-forge-${crate}"
            attempt=0
            while true; do
              if curl --proto '=https' --tlsv1.2 --retry 3 -fsS "https://crates.io/api/v1/crates/${name}/${version}" >/dev/null 2>&1; then
                echo "OK ${name} ${version} is live"; break
              fi
              attempt=$((attempt + 1))
              if [ "${attempt}" -gt 25 ]; then
                echo "::error::${name} still not published after ${attempt} attempts"; exit 1
              fi
              echo "publishing ${name} (attempt ${attempt})..."
              if cargo publish -p "${name}" --locked; then
                sleep 20
              else
                echo "  publish failed (likely 429 new-crate rate limit) - sleeping 90s"; sleep 90
              fi
            done
          done
          echo "every workspace crate published at ${version}"
