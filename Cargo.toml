# DDF review route R59: declared MSRV and locked dependency validation; see current verification and CI.
# Design/status: docs/RECOMMENDATION_INTEGRATION.md#ddf-r59
# Module vault note (bidirectional): obsidian://open?vault=deep-diff-forge.vault&file=Implementation%2FModules%2FCargo.toml
[workspace]
members = [
  "crates/deep-diff-forge-core",
  "crates/deep-diff-forge-patch",
  "crates/deep-diff-forge-projection",
  "crates/deep-diff-forge-pipeline",
  "crates/deep-diff-forge-syntax",
  "crates/deep-diff-forge-graph",
  "crates/deep-diff-forge-agent",
  "crates/deep-diff-forge-tui",
  "crates/deep-diff-forge-cluster",
  "crates/deep-diff-forge-learning",
  "crates/deep-diff-forge-daemon",
  "crates/deep-diff-forge-review",
  "crates/deep-diff-forge-cli",
  "crates/deep-diff-forge-sdk",
  "crates/deep-diff-forge-testkit",
]
resolver = "2"
exclude = ["fuzz"]

[workspace.package]
version = "0.8.2"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Louranicas/deep-diff-forge"
homepage = "https://github.com/Louranicas/deep-diff-forge"
rust-version = "1.88"
keywords = ["diff", "code-review", "patch", "git", "tui"]
categories = ["development-tools", "command-line-utilities"]

# Make the "zero unsafe" guarantee compiler-enforced across every crate, not a
# convention. Members opt in with `[lints] workspace = true`. `unsafe_code =
# "forbid"` cannot be locally overridden by an `#[allow]`, so a future unsafe
# block fails the build.
[workspace.lints.rust]
unsafe_code = "forbid"

# Clippy restriction lints that enforce panic-discipline in production code.
# `unwrap_in_result` fires only when `.unwrap()`/`.expect()` appears in a function
# whose return type is `Result` or `Option` — production code must propagate errors,
# not panic. Test functions return `()` and are therefore naturally exempt.
# `panic_in_result_fn` similarly forbids explicit `panic!` in Result-returning fns.
[workspace.lints.clippy]
unwrap_in_result = "deny"
panic_in_result_fn = "deny"
# A lint is silenced only by `#[expect(.., reason = "..")]` (anchor B-03): the reason is
# reviewed, and an expectation that stops firing fails the build, so it cannot go stale.
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

# Internal crates are declared once here with paired path + version — the
# publishable-workspace pattern (cargo-deny `wildcards = "deny"` requires a
# version on every path dep, and crates.io requires it to resolve a published
# dependency). Members reference them via `<crate>.workspace = true`, so a
# version bump is a single edit to `[workspace.package].version` + the lines
# below.
[workspace.dependencies]
deep-diff-forge-core = { path = "crates/deep-diff-forge-core", version = "0.8.2" }
deep-diff-forge-patch = { path = "crates/deep-diff-forge-patch", version = "0.8.2" }
deep-diff-forge-projection = { path = "crates/deep-diff-forge-projection", version = "0.8.2" }
deep-diff-forge-pipeline = { path = "crates/deep-diff-forge-pipeline", version = "0.8.2" }
deep-diff-forge-syntax = { path = "crates/deep-diff-forge-syntax", version = "0.8.2" }
deep-diff-forge-graph = { path = "crates/deep-diff-forge-graph", version = "0.8.2" }
deep-diff-forge-agent = { path = "crates/deep-diff-forge-agent", version = "0.8.2" }
deep-diff-forge-tui = { path = "crates/deep-diff-forge-tui", version = "0.8.2" }
deep-diff-forge-cluster = { path = "crates/deep-diff-forge-cluster", version = "0.8.2" }
deep-diff-forge-learning = { path = "crates/deep-diff-forge-learning", version = "0.8.2" }
deep-diff-forge-daemon = { path = "crates/deep-diff-forge-daemon", version = "0.8.2" }
deep-diff-forge-sdk = { path = "crates/deep-diff-forge-sdk", version = "0.8.2" }

deep-diff-forge-review = { path = "crates/deep-diff-forge-review", version = "0.8.2" }
# Test-only and never published: path only, so `cargo publish` strips it from dev-dependencies
# (deny.toml `allow-wildcard-paths` admits exactly this). Never a normal dependency (B-05 table).
deep-diff-forge-testkit = { path = "crates/deep-diff-forge-testkit" }

# One codegen unit, so a release binary's speed does not depend on how LLVM happens to split
# unrelated code. With the default 16, PR #101 (which changed no parser code) built a binary
# whose parse_seal bench was 1.27x slower than main's, reproduced locally and in CI; built with
# one unit each, the two were within 1.01x (measured, 2026-11-04). It also makes the release
# build more reproducible. Checked by release_workflow.rs.
[profile.release]
codegen-units = 1
