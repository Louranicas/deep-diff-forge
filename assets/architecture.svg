<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="760" viewBox="0 0 1280 760" role="img" aria-labelledby="title desc">
<title id="title">How Deep-Diff-Forge v0.11.0 turns a change into a review</title>
<desc id="desc">Inputs (a piped patch, a Git selection, a file pair, judge_patch, or source files) pass through one parse, 42-shape conformance, guard and seal path in the patch crate, producing the immutable review model. Empty stdin without --allow-empty exits 4; explicit --require-files or --require-hunks refusals exit 7. Enrichment layers (27-signal dual-reader risk and diagnostics.v0, projection, cluster, syntax, agent findings, learning) read that model and never write it. Seven surfaces serve the result: CLI, agent hooks and project ledger (state v13, HMAC-SHA-256), Unix-socket daemon (Protocol 3, 17 RPC methods), stdio rpc and 9-tool MCP server, TUI cockpit, Rust and Python SDKs, and eval/bench. The review council runs separately over a sealed snapshot with 8 rootless Podman evidence gates and a hash-chained tuicr decision journal.</desc>
<style>
  :root { --bg:#ffffff; --panel:#f6f8fa; --line:#d0d7de; --ink:#1f2328; --soft:#57606a; --faint:#8c959f; --accent:#bc4c00; --accent-bg:#fff1e5; --ok:#1a7f37; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#13161a; --panel:#1b2026; --line:#30363d; --ink:#e6edf3; --soft:#adbac7; --faint:#6e7681; --accent:#e3a872; --accent-bg:#2a1f17; --ok:#3fb950; }
  }
  .bg { fill: var(--bg); }
  .panel { fill: var(--panel); stroke: var(--line); stroke-width: 1; }
  .truth { fill: var(--accent-bg); stroke: var(--accent); stroke-width: 1.5; }
  .head { font: 600 11px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 2.2px; fill: var(--faint); }
  .name { font: 600 14.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--ink); }
  .crate { font: 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--accent); }
  .note { font: 12.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--soft); }
  .tiny { font: 11.5px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--faint); }
  .flow { stroke: var(--soft); stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
  .read { stroke: var(--faint); stroke-width: 1.2; stroke-dasharray: 4 4; fill: none; }
  .accent { fill: var(--accent); }
  .ok { fill: var(--ok); }
</style>
