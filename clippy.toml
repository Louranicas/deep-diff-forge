# Effect doors (anchor B-04). Each method below reaches outside the process: it spawns a program,
# reads the environment, reads a clock or sleeps. Production code reaches them only through a
# named door: a function carrying `#[expect(clippy::disallowed_methods, reason = "<door>")]`, so a
# new effect is a reviewed diff rather than a line anywhere. Integration tests opt in per file.
disallowed-methods = [
    { path = "std::process::Command::new", reason = "spawn a process only through a named door" },
    { path = "std::env::var", reason = "read the environment only through a named door" },
    { path = "std::env::var_os", reason = "read the environment only through a named door" },
    { path = "std::time::Instant::now", reason = "read a clock only through a named door" },
    { path = "std::time::SystemTime::now", reason = "read a clock only through a named door" },
    { path = "std::thread::sleep", reason = "sleep only through a named door" },
    # Scratch files: a hand-built temp path is a leak waiting to happen (DDF-TEST-TMPLEAK-001).
    { path = "std::env::temp_dir", reason = "take a self-removing directory: deep_diff_forge_testkit::Scratch" },
    # Unbounded waits: a child that hangs or never stops writing hangs or bloats its caller. Use
    # `deep_diff_forge_core::process::run_bounded` (a deadline and output caps), or reap a child
    # you just killed inside a reviewed door.
    { path = "std::process::Command::output", reason = "wait for a child only under a deadline: core::process::run_bounded" },
    { path = "std::process::Command::status", reason = "wait for a child only under a deadline: core::process::run_bounded" },
    { path = "std::process::Child::wait", reason = "wait for a child only under a deadline: core::process::run_bounded" },
    { path = "std::process::Child::wait_with_output", reason = "wait for a child only under a deadline: core::process::run_bounded" },
]
