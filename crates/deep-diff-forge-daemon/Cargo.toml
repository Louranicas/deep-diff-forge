[package]
name = "deep-diff-forge-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Optional UDS JSON-RPC review daemon for Deep-Diff-Forge (std-first, no async runtime)."

[dependencies]
deep-diff-forge-agent.workspace = true
deep-diff-forge-core.workspace = true
deep-diff-forge-patch.workspace = true
deep-diff-forge-graph.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1.1", features = ["fs", "net", "process"] }

# The peer-credential call outside Linux (`getpeereid`); Linux uses rustix's `SO_PEERCRED`.
[target.'cfg(not(any(target_os = "linux", target_os = "android")))'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "user"] }

[lints]
workspace = true
