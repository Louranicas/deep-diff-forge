# cargo-deny supply-chain policy (deployment framework gap analysis, P1).
# The workspace is dependency-free today; this policy guards future growth
# (the tree-sitter / TUI / async waves) before heavy deps arrive.

[advisories]
version = 2
yanked = "deny"
unmaintained = "all"
ignore = []
# RUSTSEC-2026-0002 is intentionally not waived: ratatui 0.30.2 resolves to a
# patched lru release. Unsoundness advisories remain fatal in the cargo-audit
# workflow even when cargo-deny classifies them as informational.

[licenses]
version = 2
# Permissive licenses compatible with this project's MIT OR Apache-2.0.
allow = [
  "MIT",
  "NCSA",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# A path-only dependency counts as a wildcard unless it is a dev-dependency or its crate is not
# published. Only the test-only `deep-diff-forge-testkit` relies on this (crate-edges: dev only).
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
