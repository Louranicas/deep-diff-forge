[package]
name = "deep-diff-forge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
deep-diff-forge-review = { path = "../crates/deep-diff-forge-review", version = "0.9.0" }
deep-diff-forge-agent = { path = "../crates/deep-diff-forge-agent", version = "0.9.0" }
deep-diff-forge-core = { path = "../crates/deep-diff-forge-core", version = "0.9.0" }
deep-diff-forge-daemon = { path = "../crates/deep-diff-forge-daemon", version = "0.9.0" }
deep-diff-forge-graph = { path = "../crates/deep-diff-forge-graph", version = "0.9.0" }
deep-diff-forge-patch = { path = "../crates/deep-diff-forge-patch", version = "0.9.0", features = ["json"] }
deep-diff-forge-syntax = { path = "../crates/deep-diff-forge-syntax", version = "0.9.0" }
libfuzzer-sys = "0.4"
# The compiler's own lexer, as published for rust-analyzer: the oracle of `rust_code_view`. A
# dependency of this crate only, never of one that ships. Its tables are Unicode 18.0.0 with
# `unicode-ident` 1.0.26 or later and `unicode-properties` 0.1.5 (the crate refuses to build
# when the two disagree), which is the version of the tables in the graph crate's `lexical.rs`.
ra-ap-rustc_lexer = "0.184.0"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# As in the workspace (anchor B-03): `#[expect(.., reason = "..")]`, never `#[allow]`.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[[bin]]
name = "patch_parser"
path = "fuzz_targets/patch_parser.rs"
