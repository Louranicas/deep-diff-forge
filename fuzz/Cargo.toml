[package]
name = "deep-diff-forge-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
deep-diff-forge-review = { path = "../crates/deep-diff-forge-review", version = "0.4.0" }
deep-diff-forge-agent = { path = "../crates/deep-diff-forge-agent", version = "0.4.0" }
deep-diff-forge-core = { path = "../crates/deep-diff-forge-core", version = "0.4.0" }
deep-diff-forge-daemon = { path = "../crates/deep-diff-forge-daemon", version = "0.4.0" }
deep-diff-forge-patch = { path = "../crates/deep-diff-forge-patch", version = "0.4.0", features = ["json"] }
deep-diff-forge-syntax = { path = "../crates/deep-diff-forge-syntax", version = "0.4.0" }
libfuzzer-sys = "0.4"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# As in the workspace (anchor B-03): `#[expect(.., reason = "..")]`, never `#[allow]`.
[lints.clippy]
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[[bin]]
name = "patch_parser"
path = "fuzz_targets/patch_parser.rs"
test = false
doc = false
bench = false

[[bin]]
name = "review_json"
path = "fuzz_targets/review_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "daemon_protocol"
path = "fuzz_targets/daemon_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "agent_annotation"
path = "fuzz_targets/agent_annotation.rs"
test = false
doc = false
bench = false

[[bin]]
name = "council_report"
path = "fuzz_targets/council_report.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stdio_mcp"
path = "fuzz_targets/stdio_mcp.rs"
test = false
doc = false
bench = false

[[bin]]
name = "stdio_rpc"
path = "fuzz_targets/stdio_rpc.rs"
test = false
doc = false
bench = false

[[bin]]
name = "structural_soundness"
path = "fuzz_targets/structural_soundness.rs"
test = false
doc = false
bench = false
